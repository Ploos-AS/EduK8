name: K8 emulator

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run emulator tests
        run: python -m pytest -q emulator/test_k8.py emulator/test_microcode.py tests/conformance/test_vectors.py
