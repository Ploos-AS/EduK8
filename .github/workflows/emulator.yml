name: K8 emulator

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Generate control ROM
        run: python tools/generate_control_rom.py
      - name: Run emulator tests
        run: python -m pytest -q emulator/test_k8.py emulator/test_io.py assembler/test_k8asm.py tests/test_keyboard_echo_e2e.py emulator/test_microcode.py tests/conformance/test_vectors.py tests/test_control_word.py tests/test_control_rom.py tests/test_microcode_patterns.py tests/test_microcode_coverage.py
