name: K8 Classic pre-freeze

on:
  push:
    paths:
      - "hardware/classic/**"
      - "spec/control-word.json"
      - "spec/microcode.json"
      - "spec/memory-map.json"
      - ".github/workflows/classic-prefreeze.yml"
  pull_request:
    paths:
      - "hardware/classic/**"
      - "spec/control-word.json"
      - "spec/microcode.json"
      - "spec/memory-map.json"
      - ".github/workflows/classic-prefreeze.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Classic pre-freeze invariants
        run: python hardware/classic/validate_prefreeze.py
